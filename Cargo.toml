[workspace]
members = [
    "src/actor-framework",
    "src/actor-framework-macros",
    "examples/module-lib",
    "examples/module-app",
]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
authors = ["Burak <burak.kizilkaya@outlook.com>"]
license = "MIT"
homepage = "https://github.com/klab365/actor-framework-rs"
repository = "https://github.com/klab365/actor-framework-rs"
readme = "Readme.md"
keywords = ["actor", "async", "tokio", "embedded"]
categories = ["asynchronous", "concurrency", "embedded", "no-std"]

[workspace.dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
