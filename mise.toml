[tools]
rust = { version = "stable", components = ["clippy", "rustfmt"], targets = ["wasm32-unknown-unknown"] }
node = "24"
"cargo:wasm-bindgen-cli" = "0.2.129"


[tasks.check]
description = "Check the runtime-neutral crate boundary"
run = "cargo check -p actor-framework-rs --no-default-features"

[tasks.test-core]
description = "Test the core without runtime features"
run = "cargo test -p actor-framework-rs --no-default-features"

[tasks.check-wasm]
description = "Compile the WASM adapter and executable JS test"
run = "cargo test -p actor-framework-rs --no-default-features --features wasm --target wasm32-unknown-unknown --test wasm --test wasm_macros --no-run"

[tasks.test-wasm]
description = "Test bounded WASM channel semantics on the host"
run = "cargo test -p actor-framework-rs --no-default-features --features wasm --test wasm"

[tasks.check-wasm-example]
description = "Build the runnable WASM actor example"
run = "cargo build --manifest-path examples/wasm/Cargo.toml --target wasm32-unknown-unknown"

[tasks.wasm-example]
description = "Build and serve the browser-visible WASM ping-pong example"
run = """
mise run check-wasm-example
rm -rf examples/wasm/pkg
wasm-bindgen --target web --out-dir examples/wasm/pkg \\
  examples/wasm/target/wasm32-unknown-unknown/debug/actor_framework_wasm_example.wasm
python3 -m http.server --directory examples/wasm 8080
"""

[tasks.check-tokio]
description = "Check the Tokio implementation"
run = "cargo check --workspace --all-features"

[tasks.check-format]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check && cargo fmt --manifest-path examples/wasm/Cargo.toml -- --check"

[tasks.format]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "Lint the Tokio implementation"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run Tokio implementation tests"
run = "cargo test --workspace --all-features"

[tasks.docs]
description = "Build Tokio implementation documentation"
run = "RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps"

[tasks.check-example]
description = "Run the Tokio actor-system example"
run = "cargo run --manifest-path examples/tokio/Cargo.toml"

[tasks.check-module-example]
description = "Run the cross-crate actor module example"
run = "cargo run -p actor-framework-module-app-example"

[tasks.publish-dry-run]
description = "Verify workspace crates can be packaged and published"
run = "cargo publish --workspace --dry-run --allow-dirty"
