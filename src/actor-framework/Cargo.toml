[package]
name = "actor-framework-rs"
description = "A statically routed async actor framework for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "actor_framework"

[lints]
workspace = true

[features]
default = ["tokio"]
std = []
tokio = ["std", "dep:tokio", "dep:actor-framework-macros"]
wasm = ["std", "dep:async-channel", "dep:wasm-bindgen-futures", "dep:actor-framework-macros"]
embassy = []

[dependencies]
actor-framework-macros = { version = "0.1.0", path = "../actor-framework-macros", optional = true }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"], optional = true }

async-channel = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
trybuild = "1"
futures-lite = "2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
