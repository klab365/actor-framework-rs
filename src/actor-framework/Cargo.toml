[package]
name = "actor-framework-rs"
description = "A statically routed async actor framework for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "actor_framework"

[lints]
workspace = true

[features]
default = ["tokio"]
std = []
tokio = ["std", "dep:tokio", "dep:actor-framework-macros"]
wasm = ["std", "dep:async-channel", "dep:wasm-bindgen-futures", "dep:actor-framework-macros"]
embassy = ["dep:embassy-sync", "dep:embassy-futures", "dep:actor-framework-macros"]

[dependencies]
embassy-sync = { version = "0.8", optional = true, default-features = false }
embassy-futures = { version = "0.1", optional = true }
actor-framework-macros = { version = "1.0.0", path = "../actor-framework-macros", optional = true }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"], optional = true }

async-channel = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-executor = { version = "0.10", features = ["platform-std", "executor-thread"] }
static_cell = "2"
trybuild = "1"
futures-lite = "2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
