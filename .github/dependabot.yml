version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/examples/tokio"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
