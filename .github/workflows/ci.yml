name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Flashing needs local USB/system libraries; CI only compiles embedded firmware.
env:
  MISE_DISABLE_TOOLS: cargo:probe-rs-tools


jobs:
  rebase:
    name: Rebased on main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Require main in the PR history
        run: |
          git fetch origin "${{ github.base_ref }}"
          git merge-base --is-ancestor FETCH_HEAD HEAD || {
            echo "This PR must be rebased onto the latest ${{ github.base_ref }} before merging."
            exit 1
          }

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: mise run check-format

  runtime-neutral:
    name: Runtime-neutral boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: mise run check
      - run: mise run test-core

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: mise run test-wasm
      - run: mise run check-wasm
      - run: mise run check-wasm-example
      - name: Add Cargo binaries to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Execute local actor on Node
        run: cargo test -p actor-framework-rs --locked --no-default-features --features wasm --target wasm32-unknown-unknown --test wasm --test wasm_macros
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  embassy:
    name: Embassy Cortex-M4F
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: rustup target add thumbv7em-none-eabihf
      - run: mise run check-runtime-feature-matrix
      - run: mise run check-embassy
      - run: mise run check-embassy-microbit-v2
      - run: mise run test-embassy

  tokio:
    name: Tokio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: mise run check-tokio
      - run: mise run lint
      - run: mise run test
      - run: mise run docs
      - run: mise run check-example
      - run: mise run check-module-example

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: mise run publish-dry-run
