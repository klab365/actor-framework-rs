name: Issue or Task to Pull Request
inputs:
  task:
    description: GitHub issue URL or standalone task description
    required: true

steps:
  - id: plan
    agent: planner
    maxVisits: 200
    task: |-
      Plan this task: ${{ inputs.task }}
      If the input is a GitHub issue URL, inspect its details with gh and include the issue ID.
      Previous human feedback, if any: ${{ steps.human_review.response }}
    transitions:
      completed: build

  - id: build
    agent: builder
    maxVisits: 200
    task: |-
      Implement the plan for: ${{ inputs.task }}
      Plan: ${{ steps.plan.response }}
      Builder correction feedback: ${{ steps.check_gate.response }}
      Independent review feedback: ${{ steps.review.response }}
      Follow-up plan feedback: ${{ steps.plan.response }}
    transitions:
      completed: checks

  - id: checks
    shell: |
      set +e
      for task in check check-format lint test docs; do
        echo "===== mise run ${task} ====="
        mise run "$task"
        result=$?
        echo "FACTORY_CHECK_RESULT ${task} ${result}"
      done
      exit 0
    outputs:
      stdout: true
    transitions:
      completed: check_gate

  - id: check_gate
    agent: check-gate
    maxVisits: 200
    task: |-
      Inspect the complete check output and determine whether all five required mise tasks passed.
      Check output: ${{ steps.checks.stdout }}
      If any failed or output is insufficient, report failed and give the builder precise correction feedback.
    transitions:
      passed: review
      failed: build

  - id: review
    agent: reviewer
    maxVisits: 200
    task: |-
      Independently review the implementation and test/check results for correctness, regressions, and missing tests.
      Do not modify files. Review output: ${{ steps.checks.stdout }}
      If findings exist, report findings with actionable feedback; otherwise report completed.
    transitions:
      completed: human_review
      findings: build

  - id: human_review
    human:
      prompt: Review the completed and independently reviewed change. Approve to publish, request changes, or reject.
      choices: [approved, changes_requested, rejected]
    maxVisits: 200
    transitions:
      approved: publish
      changes_requested: plan
      rejected: end

  - id: publish
    agent: publisher
    maxVisits: 200
    task: |-
      Create a Conventional Commit, push the current dedicated task branch, and create or update its GitHub PR using gh.
      Task: ${{ inputs.task }}
      Plan: ${{ steps.plan.response }}
      Include `Closes #<issue-id>` in the PR description if the input was a GitHub issue URL.
      Do not publish a crate release. Report the resulting commit and PR URL.
    transitions:
      completed: end
